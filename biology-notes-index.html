<style>
:root{
  --bg:#f5fbf8;--card:#fff;--text:#17352d;--muted:#60756e;--primary:#087f5b;

}
body.dark{--bg:#0d1714;--card:#14231e;--text:#e9fff6;--muted:#a6beb5;--soft:#17372d;--border:#28483e;--shadow:0 10px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Noto Sans,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
button,input{font:inherit}.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav{max-width:1150px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;color:var(--primary);font-size:1.05rem}.actions{display:flex;gap:8px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 13px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}
.hero{max-width:1150px;margin:auto;padding:55px 18px 30px;display:grid;grid-template-columns:1.5fr 1fr;gap:25px;align-items:center}
.hero h1{font-size:clamp(2rem,6vw,4.2rem);line-height:1.05;margin:0 0 15px}
.hero p{color:var(--muted);font-size:1.05rem}.badge{display:inline-block;background:var(--soft);color:var(--primary);padding:7px 12px;border-radius:99px;font-weight:700}
.hero-art{background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid var(--border);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
.searchbox{max-width:1150px;margin:10px auto 25px;padding:0 18px}
.search{width:100%;padding:16px 18px;border:2px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);outline:none}
.search:focus{border-color:var(--primary)}
.progress{max-width:1150px;margin:0 auto 30px;padding:0 18px}
.progressbar{height:10px;background:var(--border);border-radius:99px;overflow:hidden}.progressfill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:.4s}
.container{max-width:1150px;margin:auto;padding:0 18px 60px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 15px}.section-title h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.chapter{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
.chapter:hover{transform:translateY(-3px);border-color:var(--primary)}
.num{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-weight:900}
.chapter h3{margin:13px 0 5px}.chapter p{color:var(--muted);margin:0;font-size:.92rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.tag{font-size:.75rem;background:var(--soft);padding:4px 8px;border-radius:99px;color:var(--primary)}
.hidden{display:none!important}
.reader{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.reader-head{padding:24px;border-bottom:1px solid var(--border);background:var(--soft)}
.reader-head h1{margin:5px 0}.reader-body{padding:22px}
.back{margin-bottom:15px}.toc{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.toc button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 10px;cursor:pointer}
.box{padding:16px;border-left:5px solid var(--primary);background:var(--soft);border-radius:10px;margin:16px 0}
details{border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin:10px 0;background:var(--card)}
summary{cursor:pointer;font-weight:750}.answer{margin-top:10px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin:15px 0;overflow:hidden;border-radius:10px}th,td{border:1px solid var(--border);padding:10px;text-align:left}th{background:var(--soft)}
.diagram{border:1px solid var(--border);border-radius:16px;padding:12px;background:var(--card);text-align:center;margin:18px 0;overflow:auto}.diagram svg{max-width:100%;height:auto}.caption{color:var(--muted);font-size:.9rem}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:15px 0}.flow span{background:var(--soft);padding:9px 12px;border-radius:10px;font-weight:650}.arrow{color:var(--primary);font-weight:900}
.question{margin:9px 0}.qhead{font-weight:800;color:var(--primary)}
footer{text-align:center;border-top:1px solid var(--border);padding:30px;color:var(--muted)}
#backTop{position:fixed;right:16px;bottom:16px;display:none;border:0;background:var(--primary);color:white;border-radius:50%;width:46px;height:46px;cursor:pointer}
@media(max-width:850px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding-top:35px}.reader-body{padding:15px}.nav{padding:10px 12px}.brand{font-size:.9rem}.actions .btn{padding:7px 9px}}
</style>
</head>

<h2>📚 Important Definitions</h2>
${defs.map(a=>`<div class="box"><b>${a[0]}</b><br>${a[1]}</div>`).join("")}
<h2>🧠 Important Concepts</h2><ul>${notes.map(n=>`<li>${n}</li>`).join("")}</ul>
<h2>🖼️ Diagram / Figure</h2>
<div class="diagram" onclick="this.classList.toggle('zoomed')">${svg(x.diagram||"flow")}<p class="caption">Diagram Explanation: Ye simplified educational figure concept ko quickly samajhne aur exam revision me help karta hai. Diagram ko tap karke focus view toggle karein.</p></div>
<h2>🔄 Flowchart</h2>
<div class="flow"><span>Concept</span><b class="arrow">→</b><span>Process</span><b class="arrow">→</b><span>Result</span><b class="arrow">→</b><span>Biological significance</span></div>
<h2>⚖️ Important Differences</h2>
<table><tr><th>Point</th><th>Concept A</th><th>Concept B</th></tr><tr><td>Meaning</td><td>First concept ka basic idea</td><td>Second concept ka basic idea</td></tr><tr><td>Key feature</td><td>Important feature</td><td>Important feature</td></tr><tr><td>Example</td><td>Relevant example</td><td>Relevant example</td></tr></table>
<h2>📝 Board Exam Important Questions</h2>
${["1 Mark","2 Mark","3 Mark","5 Mark"].map((m,i)=>`<details class="question"><summary>${m} Questions</summary><div class="answer"><b>${i+1}. Explain one important concept of ${c.t}.</b><br><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('hidden')">Show/Hide Answer</button><p class="hidden">Answer: Definition + key points + relevant example/diagram ko clear sequence me likhein. Exam me scientific terms aur labels ka use karein.</p></div></details>`).join("")}
<h2>⚡ One Page Quick Revision</h2>
<div class="box"><b>Keywords:</b> ${c.tags.join(" • ")}<br><br><b>Revision Formula:</b> Definition → Process → Diagram → Example → Exam Question</div>
`;
}

const cards=document.getElementById("cards");
function renderCards(list=chapters){
cards.innerHTML=list.map(c=>`<div class="chapter" data-id="${c.n}" onclick="openChapter(${c.n})"><div class="num">${c.n}</div><h3>${c.t}</h3><p>${c.d}</p><div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div></div>`).join("");
document.getElementById("resultCount").textContent=`${list.length} chapters`;
}
function openChapter(n){
const c=chapters.find(x=>x.n===n); if(!c)return;
document.getElementById("chapterList").classList.add("hidden");
document.querySelector(".hero").classList.add("hidden");
document.querySelector(".searchbox").classList.add("hidden");
document.querySelector(".progress").classList.add("hidden");
document.getElementById("reader").classList.remove("hidden");
document.getElementById("readerTitle").innerHTML=`<span class="badge">Chapter ${c.n}</span><h1>${c.t}</h1><p>${c.d}</p>`;
document.getElementById("toc").innerHTML=`<button onclick="scrollToSection('content')">📌 Notes</button><button onclick="markDone(${c.n})">✅ Mark Completed</button>`;
document.getElementById("content").innerHTML=build(c);
localStorage.setItem("lastChapter",n);
window.scrollTo({top:0,behavior:"smooth"});
}
function showHome(){
document.getElementById("reader").classList.add("hidden");
document.getElementById("chapterList").classList.remove("hidden");
document.querySelector(".hero").classList.remove("hidden");
document.querySelector(".searchbox").classList.remove("hidden");
document.querySelector(".progress").classList.remove("hidden");
window.scrollTo({top:0,behavior:"smooth"});
}
function markDone(n){
let done=JSON.parse(localStorage.getItem("doneBio")||"[]");
if(!done.includes(n))done.push(n); localStorage.setItem("doneBio",JSON.stringify(done)); updateProgress();
}
function updateProgress(){
let done=JSON.parse(localStorage.getItem("doneBio")||"[]"), total=chapters.length;
document.getElementById("progressText").textContent=`${done.length} / ${total} chapters`;
document.getElementById("progressFill").style.width=(done.length/total*100)+"%";
}
function scrollToSection(id){document.getElementById(id).scrollIntoView({behavior:"smooth"})}
document.getElementById("search").addEventListener("input",e=>{
const q=e.target.value.toLowerCase().trim();
renderCards(!q?chapters:chapters.filter(c=>(c.t+" "+c.d+" "+c.tags.join(" ")+" "+c.topic).toLowerCase().includes(q)));
});
document.getElementById("backBtn").onclick=showHome;
document.getElementById("homeBtn").onclick=showHome;
document.getElementById("startBtn").onclick=()=>document.getElementById("chapterList").scrollIntoView({behavior:"smooth"});
document.getElementById("themeBtn").onclick=()=>{
document.body.classList.toggle("dark");
localStorage.setItem("bioTheme",document.body.classList.contains("dark")?"dark":"light");
document.getElementById("themeBtn").textContent=document.body.classList.contains("dark")?"☀️":"🌙";
};
if(localStorage.getItem("bioTheme")==="dark"){document.body.classList.add("dark");document.getElementById("themeBtn").textContent="☀️"}
document.getElementById("backTop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
window.addEventListener("scroll",()=>document.getElementById("backTop").style.display=scrollY>400?"block":"none");
renderCards();updateProgress();
</script>
</body>
</html>
